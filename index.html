<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Kontak Pembuat Aplikasi — @raitttt</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #ffffff; color: #20252d; padding: 24px; }
    .contact { width: min(100%, 390px); text-align: center; padding: 28px 22px; border: 1px solid #e8ebef; border-radius: 16px; box-shadow: 0 6px 24px rgba(20, 25, 36, .045); }
    .problem { margin: 0 0 9px; color: #d12e35; font-size: 11px; font-weight: 600; letter-spacing: .01em; }
    .message { margin: 0 0 8px; font-size: 14px; line-height: 1.6; }
    .help { margin: 0 0 20px; color: #5d6672; font-size: 13px; line-height: 1.6; }
    .message strong { font-weight: 700; }
    .whatsapp { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 11px 20px; border-radius: 10px; background: #168a4b; color: #fff; text-decoration: none; font-size: 14px; font-weight: 650; transition: background .15s ease; }
    .whatsapp:hover, .whatsapp:focus-visible { background: #10723d; }
    .whatsapp:focus-visible { outline: 3px solid #8cdbac; outline-offset: 3px; }
    .whatsapp svg { width: 18px; height: 18px; fill: currentColor; }
    .credit { margin: 24px 0 0; color: #818894; font-size: 11px; letter-spacing: .015em; }
  </style>
</head>
<body>
  <main class="contact" aria-label="Informasi kontak pembuat aplikasi">
    <p class="problem">Mengalami kendala?</p>
    <p class="message">Hubungi pembuat aplikasi <strong>@raitttt</strong> melalui WhatsApp.</p>
    <p class="help">Butuh tutorial setup atau bantuan pemasangan aplikasi? Bisa langsung hubungi saya juga.</p>
    <a class="whatsapp" href="https://wa.me/62816665264" target="_blank" rel="noopener noreferrer" aria-label="Hubungi pembuat aplikasi @raitttt melalui WhatsApp">

    <p class="credit">Designed &amp; Developed by @raitttt</p>
  </main>
</body>
</html>
